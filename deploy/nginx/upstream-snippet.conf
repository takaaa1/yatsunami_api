# Incluir no contexto `http` do nginx do host (ex.: em /etc/nginx/conf.d/), FORA de
# qualquer `server` — o nginx recusa `upstream` dentro de `server`. No server HTTPS de
# api.yatsunami.com.br, troque o proxy_pass directo para :3070 por
# `proxy_pass http://yatsunami_api_backend;`.
# O deploy blue/green expõe a API em 127.0.0.1:3070 via contentor yatsunami_api_proxy.
upstream yatsunami_api_backend {
    server 127.0.0.1:3070;
    keepalive 32;
}
